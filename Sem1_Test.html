<script>
    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }

    let timerInterval; let secondsElapsed = 0;
    function startTimer() { clearInterval(timerInterval); secondsElapsed = 0; const td = document.getElementById('timer-display'); td.style.display = window.innerWidth > 768 ? 'block' : 'inline-block'; td.innerText = "⏱ 00:00"; timerInterval = setInterval(() => { secondsElapsed++; let m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0'); let s = (secondsElapsed % 60).toString().padStart(2, '0'); td.innerText = `⏱ ${m}:${s}`; }, 1000); }
    function stopTimer() { clearInterval(timerInterval); let m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0'); let s = (secondsElapsed % 60).toString().padStart(2, '0'); return `${m} minutes and ${s} seconds`; }
    function renderMath() { if (window.MathJax && window.MathJax.typesetPromise) { MathJax.typesetPromise().catch(err => console.error(err)); } else { setTimeout(renderMath, 150); } }

    const generators = {
        "determinant": {
            "mcq": [
                () => ({ en: `$\\log_3 1 = $`, gu: `$\\log_3 1 = $`, correct: `0`, distractors: [`1`, `3`, `1/3`], sol: `Logarithm of 1 to any base is 0.` }),
                () => ({ en: `If $f(x) = e^{x-1}$, then $f(1) = $`, gu: `જો $f(x) = e^{x-1}$ હોય તો $f(1) = $`, correct: `1`, distractors: [`0`, `-1`, `$e$`], sol: `$f(1) = e^{1-1} = e^0 = 1$.` }),
                () => ({ en: `$\\log_5 125 = $`, gu: `$\\log_5 125 = $`, correct: `3`, distractors: [`25`, `125`, `0`], sol: `$5^3 = 125 \\implies \\log_5 125 = 3$.` }),
                () => ({ en: `If $f(x) = x^3 - 7$, then $f(-2) = $`, gu: `જો $f(x) = x^3 - 7$ હોય તો સીધી કિંમત મૂકતા $f(-2) = $`, correct: `-15`, distractors: [`1`, `-1`, `15`], sol: `$f(-2) = (-2)^3 - 7 = -8 - 7 = -15$.` }),
                () => ({ en: `If $a = 4i - 3j$, then $|a| = $`, gu: `જો $a = 4i - 3j$ હોય તો સદિશનું મૂલ્ય $|a| = $`, correct: `5`, distractors: [`0`, `1`, `7`], sol: `$|a| = \\sqrt{4^2 + (-3)^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5$.` }),
                () => ({ en: `If $f(x) = x^2$, then $f(-1) = $`, gu: `જો $f(x) = x^2$ હોય તો $f(-1) = $`, correct: `1`, distractors: [`0`, `-1`, `2`], sol: `$f(-1) = (-1)^2 = 1$.` }),
                () => ({ en: `$\\log_{10} 1 = $`, gu: `$\\log_{10} 1 = $`, correct: `0`, distractors: [`1`, `10`, `-1`], sol: `Logarithm of 1 is always 0.` }),
                () => ({ en: `If $\\begin{vmatrix} x & 1 \\\\ 4 & 2 \\end{vmatrix} = 6$, then $x = $`, gu: `જો $\\begin{vmatrix} x & 1 \\\\ 4 & 2 \\end{vmatrix} = 6$ તો $x = $`, correct: `5`, distractors: [`1`, `-5`, `-1`], sol: `$2x - (4)(1) = 6 \\implies 2x - 4 = 6 \\implies 2x = 10 \\implies x = 5$.` }),
                () => ({ en: `If $\\log_3 x = 2$, then $x = $`, gu: `જો $\\log_3 x = 2$ તો $x = $`, correct: `9`, distractors: [`1`, `6`, `8`], sol: `Exponential form: $x = 3^2 = 9$.` }),
                () => ({ en: `$4^{\\log_4 16} = $`, gu: `$4^{\\log_4 16} = $`, correct: `16`, distractors: [`1`, `4`, `2`], sol: `Using identity $a^{\\log_a N} = N$, answer is 16.` }),
                () => ({ en: `If $f(x) = 5^x$, then $f(-2) = $`, gu: `જો $f(x) = 5^x$ હોય તો $f(-2) = $`, correct: `$1/25$`, distractors: [`10`, `25`, `-10`], sol: `$f(-2) = 5^{-2} = 1/5^2 = 1/25$.` }),
                () => ({ en: `$\\begin{vmatrix} -1 & 3 \\\\ -4 & 6 \\end{vmatrix} = $`, gu: `$\\begin{vmatrix} -1 & 3 \\\\ -4 & 6 \\end{vmatrix} = $`, correct: `6`, distractors: [`-18`, `-6`, `18`], sol: `$= (-1)(6) - (3)(-4) = -6 + 12 = 6$.` }),
                () => ({ en: `If $\\log_x (9/16) = -2$, then $x = $`, gu: `જો $\\log_x (9/16) = -2$ તો $x =$`, correct: `$4/3$`, distractors: [`$3/4$`, `$81/256$`, `$256/81$`], sol: `$x^{-2} = 9/16 \\implies x^2 = 16/9 \\implies x = 4/3$.` }),
                () => ({ en: `$\\log_b a \\times \\log_a b = $`, gu: `$\\log_b a \\times \\log_a b = $`, correct: `1`, distractors: [`0`, `$a^b$`, `$ab$`], sol: `Base change rule yields 1.` }),
                () => ({ en: `$\\log x - \\log y = $`, gu: `$\\log x - \\log y = $`, correct: `$\\log(x/y)$`, distractors: [`$\\log(xy)$`, `$\\log(y/x)$`, `$\\log(x-y)$`], sol: `Standard logarithmic quotient law.` })
            ],
            "examples": [
                () => ({ en: `Find the value of the 3rd order determinant: $\\begin{vmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{vmatrix}$`, gu: `નિશ્ચાયકનું મૂલ્ય શોધો: $\\begin{vmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{vmatrix}$`, correct: `0`, distractors: [`1`, `-1`, `12`], sol: `Expanding along rows/columns gives 0.` }),
                () => { let a=rand(2,4); return { en: `Solve the equation: $\\begin{vmatrix} 4 & 2 & x \\\\ 1 & 5 & -1 \\\\ 3 & 2 & 3 \\end{vmatrix} = 4$.`, gu: `સમીકરણ ઉકેલો: $\\begin{vmatrix} 4 & 2 & x \\\\ 1 & 5 & -1 \\\\ 3 & 2 & 3 \\end{vmatrix} = 4$.`, correct: `4`, distractors: [`-4`, `0`, `2`], sol: `Expand and solve for $x$ to get $x=4$.` }; },
                () => ({ en: `Prove that $\\frac{1}{\\log_{24} 12} + \\frac{1}{\\log_{8} 12} + \\frac{1}{\\log_{9} 12} = 3$.`, gu: `સાબિત કરો કે $\\frac{1}{\\log_{24} 12} + \\frac{1}{\\log_{8} 12} + \\frac{1}{\\log_{9} 12} = 3$.`, correct: `Proof Verified`, distractors: [`Proof Incorrect`, `Not Possible`, `Data Missing`], sol: `Using base change rule, expression becomes $\\log_{12}(24 \\times 8 \\times 9) = \\log_{12}(1728) = \\log_{12}(12^3) = 3$.` }),
                () => ({ en: `If $f(x) = \\frac{1-x}{1+x}$, prove that $f(x) \\cdot f(-x) = 1$ and $f(x) + f(1/x) = 0$.`, gu: `જો $f(x) = \\frac{1-x}{1+x}$ હોય તો સાબિત કરો કે (1) $f(x) \\cdot f(-x) = 1$ (2) $f(x) + f(1/x) = 0$.`, correct: `Proof Verified`, distractors: [`Proof Incorrect`, `Not Possible`, `Data Missing`], sol: `Substitute functions and verify identities algebraically.` }),
                () => ({ en: `Solve: $\\log_3 x + \\log_3 16 / \\log_3 32 = \\log_3 256$ (Simplified standard form).`, gu: `ઉકેલો.`, correct: `x = 1024`, distractors: [`x = 64`, `x = 256`, `x = 32`], sol: `Apply logarithmic laws to isolate $x$.` }),
                () => ({ en: `If $\\log_{10} x^{b-c} = \\log_{10} y^{c-a} = \\log_{10} z^{a-b}$, prove that $xyz = 1$ and $x^a y^b z^c = 1$.`, gu: `જો $\\log_{10} x^{b-c} = \\log_{10} y^{c-a} = \\log_{10} z^{a-b}$ હોય તો સાબિત કરો કે $xyz = 1$.`, correct: `Proof Verified`, distractors: [`Proof Incorrect`, `Not Possible`, `Data Missing`], sol: `Equate each term to $k$, express $x, y, z$ in terms of $k$, and substitute.` }),
                () => ({ en: `If $f(x) = \\log\\left(\\frac{1-x}{1+x}\\right)$, prove that $f\\left(\\frac{2x}{1+x^2}\\right) = 2f(x)$.`, gu: `જો $f(x) = \\log\\left(\\frac{1-x}{1+x}\\right)$ હોય તો સાબિત કરો કે $f\\left(\\frac{2x}{1+x^2}\\right) = 2f(x)$.`, correct: `Proof Verified`, distractors: [`Proof Incorrect`, `Not Possible`, `Data Missing`], sol: `Substitute argument and use logarithmic properties to factor out 2.` }),
                () => ({ en: `Evaluate the determinant: $\\begin{vmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{vmatrix}$.`, gu: `નિશ્ચાયકનું મૂલ્ય શોધો: $\\begin{vmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{vmatrix}$.`, correct: `0`, distractors: [`1`, `15`, `-3`], sol: `Expansion yields 0.` }),
                () => ({ en: `If $\\log\\left(\\frac{a+b}{2}\\right) = \\frac{1}{2}(\\log a + \\log b)$, prove that $a = b$.`, gu: `જો $\\log\\left(\\frac{a+b}{2}\\right) = \\frac{1}{2}(\\log a + \\log b)$ હોય તો સાબિત કરો કે $a = b$.`, correct: `Proof Verified`, distractors: [`Proof Incorrect`, `Not Possible`, `Data Missing`], sol: `Exponentiate both sides: $\\frac{a+b}{2} = \\sqrt{ab} \\implies (a-b)^2 = 0 \\implies a=b$.` }),
                () => ({ en: `Solve the matrix/determinant equation: $\\begin{vmatrix} x & 2 & 3 \\\\ 5 & 0 & 7 \\\\ 3 & 1 & 2 \\end{vmatrix} = 30$.`, gu: `સમીકરણ ઉકેલો: $\\begin{vmatrix} x & 2 & 3 \\\\ 5 & 0 & 7 \\\\ 3 & 1 & 2 \\end{vmatrix} = 30$.`, correct: `x = 1`, distractors: [`x = -1`, `x = 2`, `x = 0`], sol: `Expand and solve for $x$ to get $x = 1$.` })
            ]
        },
        "trigonometry": {
            "mcq": [
                () => ({ en: `Principal period of $\\cos x$ is:`, gu: `$\\cos x$ વિધેયનું મુખ્ય આવતમાન = `, correct: `$2\\pi$`, distractors: [`$\\pi$`, `$4\\pi$`, `$3\\pi$`], sol: `Standard cosine period is $2\\pi$.` }),
                () => ({ en: `$150^\\circ =$ __________ Radian`, gu: `$150^\\circ =$ `, correct: `$5\\pi/6$`, distractors: [`$5\\pi/3$`, `$3\\pi/5$`, `$2\\pi/3$`], sol: `$150 \\times \\pi/180 = 5\\pi/6$.` }),
                () => ({ en: `$\\sin^{-1} x + \\cos^{-1} x = $`, gu: `$\\sin^{-1} x + \\cos^{-1} x = $`, correct: `$\\pi/2$`, distractors: [`1`, `$\\pi$`, `0`], sol: `Standard inverse trigonometric identity.` }),
                () => ({ en: `Principal period of $2\\sin\\theta \\cos\\theta = $`, gu: `$2\\sin\\theta \\cos\\theta$ નો મુખ્ય આવતકાળ = `, correct: `$\\pi$`, distractors: [`$2\\pi$`, `0`, `$\\pi/2$`], sol: `$2\\sin\\theta\\cos\\theta = \\sin(2\\theta)$, period is $2\\pi/2 = \\pi$.` }),
                () => ({ en: `$\\tan^{-1} x + \\cot^{-1} x = $ _____`, gu: `$\\tan^{-1} x + \\cot^{-1} x = $ _____`, correct: `$\\pi/2$`, distractors: [`1`, `0`, `$\\pi$`], sol: `Standard identity for all $x \\in R$.` }),

    let currentQuizData = [];

    function generateQuiz() {
        const topic = document.getElementById('topicSelect').value;
        const type = document.getElementById('typeSelect').value;
        const form = document.getElementById('quiz-form');
        const submitBtn = document.getElementById('submit-btn');
        const summaryCard = document.getElementById('summary-card');
        const actionBtns = document.getElementById('action-buttons');
        
        form.innerHTML = '';
        summaryCard.style.display = 'none';
        currentQuizData = [];

        startTimer();

        let targetCount = type === 'mcq' ? 15 : 10;
        
        let availableGenerators = [...generators[topic][type]];
        availableGenerators = shuffle(availableGenerators);

        for(let i=0; i<targetCount; i++) {
            if(i >= availableGenerators.length) break; 
            
            let qData = availableGenerators[i](); 
            
            let rawOptions = [{text: qData.correct, isCorrect: true}];
            if (qData.distractors) { qData.distractors.forEach(d => rawOptions.push({text: d, isCorrect: false})); }
            
            let options = shuffle(rawOptions);
            qData.shuffledOptions = options;
            currentQuizData.push(qData);
            
            const qBlock = document.createElement('div');
            qBlock.className = 'question-block';
            
            qBlock.innerHTML = `
                <div class="question-text">
                    <div class="bilingual-en">Q${i+1}. ${qData.en}</div>
                    <div class="bilingual-gu">પ્રશ્ન ${i+1}. ${qData.gu}</div>
                </div>
            `;

            const optionsList = document.createElement('ul');
            optionsList.className = 'options';
            
            options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <label for="q${i}_opt${idx}">
                        <input type="radio" name="q${i}" value="${opt.isCorrect ? 'correct' : 'incorrect'}" id="q${i}_opt${idx}">
                        <span>${opt.text}</span>
                    </label>
                `;
                optionsList.appendChild(li);
            });
            qBlock.appendChild(optionsList);

            const solutionDiv = document.createElement('div');
            solutionDiv.id = `solution-${i}`;
            solutionDiv.className = 'solution';
            qBlock.appendChild(solutionDiv);

            form.appendChild(qBlock);
        }
        
        actionBtns.style.display = 'flex';
        submitBtn.style.display = 'block'; submitBtn.disabled = false;
        renderMath();
    }

    function gradeQuiz() {
        const nameInput = document.getElementById('studentName');
        const enrollInput = document.getElementById('enrollmentNo');
        if (!/^[A-Za-z\s]+$/.test(nameInput.value.trim())) { alert("Please enter a valid Name (Alphabets only)."); nameInput.focus(); return; }
        if (!/^\d{12}$/.test(enrollInput.value.trim())) { alert("Please enter exactly 12 digits for Enrollment No."); enrollInput.focus(); return; }

        let score = 0, answeredAll = true;
        currentQuizData.forEach((_, i) => { if (!document.querySelector(`input[name="q${i}"]:checked`)) answeredAll = false; });
        if (!answeredAll) { alert("Please answer all questions before submitting."); return; }

        const timeTaken = stopTimer();
        document.getElementById('timer-display').style.display = 'none';
        
        currentQuizData.forEach((qData, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const solutionDiv = document.getElementById(`solution-${i}`);
            const isCorrect = selected.value === 'correct';

            if (isCorrect) {
                score++;
                solutionDiv.className = 'solution solution-correct';
                solutionDiv.innerHTML = `<strong>✓ Correct!</strong><br><br><strong>Solution / Hint:</strong><br>${qData.sol}`;
            } else {
                solutionDiv.className = 'solution solution-incorrect';
                solutionDiv.innerHTML = `<strong>✗ Incorrect.</strong><br>The correct answer is: <strong>${qData.correct}</strong>.<br><br><strong>Solution / Hint:</strong><br>${qData.sol}`;
            }
            solutionDiv.style.display = 'block';
            document.querySelectorAll(`input[name="q${i}"]`).forEach(input => input.disabled = true);
        });

        document.getElementById('test-timestamp').innerText = new Date().toLocaleString('en-IN'); 
        document.getElementById('timestamp-group').style.display = 'flex';
        nameInput.disabled = true; enrollInput.disabled = true;

        const percentage = Math.round((score / currentQuizData.length) * 100);
        let feedbackMsg = percentage >= 80 ? "Excellent Preparation!" : percentage >= 50 ? "Good job, but keep practicing." : "Needs more focus and practice.";
        let feedbackColor = percentage >= 80 ? "#059669" : percentage >= 50 ? "#d97706" : "#dc2626";

        const summaryCard = document.getElementById('summary-card');
        summaryCard.innerHTML = `<div class="summary-title">Test Completed!</div><div class="summary-stats">Score: <strong>${score} / ${currentQuizData.length}</strong> (${percentage}%)<br>Time Taken: <strong>${timeTaken}</strong></div><div class="summary-msg" style="background-color: ${feedbackColor}; color: white;">${feedbackMsg}</div>`;
        summaryCard.style.display = 'block';

        document.getElementById('submit-btn').style.display = 'none';
        renderMath(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }
